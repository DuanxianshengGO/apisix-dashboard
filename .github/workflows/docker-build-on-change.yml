name: Docker Build on Branch Changes

on:
  push:
    branches: 
      - master
      - 'release/**'
      - 'feature/**'
      - 'hotfix/**'
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - 'NOTICE'
  pull_request:
    branches: 
      - master
      - 'release/**'
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - 'NOTICE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-k8s-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-k8s-
            ${{ runner.os }}-buildx-

      - name: Build Docker image with Dockerfile.k8s
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.k8s
          push: false
          load: true
          tags: |
            apisix-dashboard:k8s-${{ github.sha }}
            apisix-dashboard:k8s-latest
          build-args: |
            APISIX_DASHBOARD_VERSION=${{ github.ref_name }}
          cache-from: |
            type=local,src=/tmp/.buildx-cache
          cache-to: |
            type=local,dest=/tmp/.buildx-cache,mode=max
          platforms: linux/amd64

      - name: Test Docker image
        run: |
          echo "Testing Docker image..."
          docker images | grep apisix-dashboard
          
          # 启动容器进行基本测试
          docker run -d --name test-container -p 9000:9000 apisix-dashboard:k8s-latest
          sleep 10
          
          # 检查容器是否正常运行
          if docker ps | grep test-container; then
            echo "✅ Container is running successfully"
          else
            echo "❌ Container failed to start"
            docker logs test-container
            exit 1
          fi
          
          # 检查健康检查端点
          if curl -f http://localhost:9000/health || curl -f http://localhost:9000/apisix/admin/migrate/export; then
            echo "✅ Health check passed"
          else
            echo "⚠️ Health check failed, but container is running"
          fi
          
          # 清理测试容器
          docker stop test-container
          docker rm test-container

      - name: Show build summary
        run: |
          echo "🎉 Docker build completed successfully!"
          echo "📦 Image: apisix-dashboard:k8s-${{ github.sha }}"
          echo "🔧 Branch: ${{ github.ref_name }}"
          echo "📝 Commit: ${{ github.sha }}"
          echo "💾 Image size:"
          docker images apisix-dashboard:k8s-latest --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"

      - name: Clean up
        if: always()
        run: |
          docker image prune -f
          docker builder prune -f