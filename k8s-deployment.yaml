apiVersion: v1
kind: ConfigMap
metadata:
  name: apisix-dashboard-config
  namespace: default
data:
  conf.yaml: |
    conf:
      listen:
        host: 0.0.0.0
        port: 9000
      allow_list:
        - 0.0.0.0/0
      etcd:
        endpoints:
          - "http://etcd-service.apisix.svc.cluster.local:2379"
        mtls:
          key_file: ""
          cert_file: ""
          ca_file: ""
      log:
        error_log:
          level: debug
          file_path: logs/error.log
        access_log:
          file_path: logs/access.log
      authentication:
        secret: secret
        expire_time: 3600
        users:
          - username: admin
            password: Goodwe!apisix123
          - username: user
            password: Goodwe!apisix123
      plugins:
        - we-oauth
        - api-breaker
        - authz-keycloak
        - basic-auth
        - batch-requests
        - consumer-restriction
        - cors
        - echo
        - fault-injection
        - grpc-transcode
        - hmac-auth
        - http-logger
        - ip-restriction
        - jwt-auth
        - kafka-logger
        - key-auth
        - limit-conn
        - limit-count
        - limit-req
        - openid-connect
        - prometheus
        - proxy-cache
        - proxy-mirror
        - proxy-rewrite
        - redirect
        - referer-restriction
        - request-id
        - request-validation
        - response-rewrite
        - serverless-post-function
        - serverless-pre-function
        - sls-logger
        - syslog
        - tcp-logger
        - udp-logger
        - uri-blocker
        - wolf-rbac
        - zipkin
        - server-info
        - traffic-split

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apisix-dashboard
  namespace: default
  labels:
    app: apisix-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apisix-dashboard
  template:
    metadata:
      labels:
        app: apisix-dashboard
    spec:
      containers:
      - name: apisix-dashboard
        image: apisix-dashboard:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        - containerPort: 9000
          name: api
        # env variables removed - etcd config is handled via ConfigMap
        volumeMounts:
        - name: config-volume
          mountPath: /usr/local/apisix-dashboard/conf
        - name: logs-volume
          mountPath: /usr/local/apisix-dashboard/logs
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: config-volume
        configMap:
          name: apisix-dashboard-config
      - name: logs-volume
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: apisix-dashboard-service
  namespace: default
  labels:
    app: apisix-dashboard
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  - port: 9000
    targetPort: 9000
    protocol: TCP
    name: api
  selector:
    app: apisix-dashboard

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apisix-dashboard-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: apisix-dashboard.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: apisix-dashboard-service
            port:
              number: 80