apiVersion: v1
kind: ConfigMap
metadata:
  name: apisix-dashboard-config
  namespace: default
data:
  conf.yaml: |
    conf:
      listen:
        host: 0.0.0.0     # `manager api` listening ip or host name
        port: 9000          # `manager api` listening port
      allow_list:           # If we don't set any IP list, then any IP access is allowed by default.
        - 0.0.0.0/0
      etcd:
        endpoints:          # supports defining multiple etcd host addresses for an etcd cluster
          - "etcd-service.apisix.svc.cluster.local:2379"
                              # yamllint disable rule:comments-indentation
                              # etcd basic auth info
        # username: "root"    # ignore etcd username if not enable etcd auth
        # password: "123456"  # ignore etcd password if not enable etcd auth
        mtls:
          key_file: ""          # Path of your self-signed client side key
          cert_file: ""         # Path of your self-signed client side cert
          ca_file: ""           # Path of your self-signed ca cert, the CA is used to sign callers' certificates
        # prefix: /apisix     # apisix config's prefix in etcd, /apisix by default
      log:
        error_log:
          level: debug       # supports levels, lower to higher: debug, info, warn, error, panic, fatal
          file_path:
            logs/error.log  # supports relative path, absolute path, standard output
                            # such as: logs/error.log, /tmp/logs/error.log, /dev/stdout, /dev/stderr
        access_log:
          file_path:
            logs/access.log  # supports relative path, absolute path, standard output
                             # such as: logs/access.log, /tmp/logs/access.log, /dev/stdout, /dev/stderr
                             # log example: 2020-12-09T16:38:09.039+0800    INFO    filter/logging.go:46    /apisix/admin/routes/r1 {"status": 401, "host": "127.0.0.1:9000", "query": "asdfsafd=adf&a=a", "requestId": "3d50ecb8-758c-46d1-af5b-cd9d1c820156", "latency": 0, "remoteIP": "127.0.0.1", "method": "PUT", "errs": []}
      authentication:
        secret:
          secret              # secret for jwt token generation.
                              # NOTE: Highly recommended to modify this value to protect `manager api`.
                              # if it's default value, when `manager api` start, it will generate a random string to replace it.
        expire_time: 3600     # jwt token expire time, in second
        users:                # yamllint enable rule:comments-indentation
          - username: admin   # username and password for login `manager api`
            password: Goodwe!apisix123
          - username: user
            password: Goodwe!apisix123
      plugins:                          # plugin list (sorted in alphabetical order)
        - we-oauth
        - api-breaker
        - authz-keycloak
        - basic-auth
        - batch-requests
        - consumer-restriction
        - cors
        # - dubbo-proxy
        - echo
        # - error-log-logger
        # - example-plugin
        - fault-injection
        - grpc-transcode
        - hmac-auth
        - http-logger
        - ip-restriction
        - jwt-auth
        - kafka-logger
        - key-auth
        - limit-conn
        - limit-count
        - limit-req
        # - log-rotate
        # - node-status
        - openid-connect
        - prometheus
        - proxy-cache
        - proxy-mirror
        - proxy-rewrite
        - redirect
        - referer-restriction
        - request-id
        - request-validation
        - response-rewrite
        - serverless-post-function
        - serverless-pre-function
        # - skywalking
        - sls-logger
        - syslog
        - tcp-logger
        - udp-logger
        - uri-blocker
        - wolf-rbac
        - zipkin
        - server-info
        - traffic-split

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apisix-dashboard
  namespace: default
  labels:
    app: apisix-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apisix-dashboard
  template:
    metadata:
      labels:
        app: apisix-dashboard
    spec:
      containers:
      - name: apisix-dashboard
        image: apisix-dashboard:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        - containerPort: 9000
          name: api
        - containerPort: 8080
          name: management
        # env variables removed - etcd config is handled via ConfigMap
        volumeMounts:
        - name: config-volume
          mountPath: /etc/apisix-dashboard
        - name: logs-volume
          mountPath: /usr/local/apisix-dashboard/logs
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: config-volume
        configMap:
          name: apisix-dashboard-config
      - name: logs-volume
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: apisix-dashboard-service
  namespace: default
  labels:
    app: apisix-dashboard
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  - port: 9000
    targetPort: 9000
    protocol: TCP
    name: api
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: management
  selector:
    app: apisix-dashboard

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apisix-dashboard-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: apisix-dashboard.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: apisix-dashboard-service
            port:
              number: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apisix-admin-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: apisix-admin.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: apisix-dashboard-service
            port:
              number: 8080